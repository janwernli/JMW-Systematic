# Builds frontend/dist on every push to main and publishes it as the asset of the rolling
# "frontend-latest" release, so the 1 GiB Azure VM never has to run Node/Vite itself
# (deploy/setup.sh and deploy/update.sh download it).
name: Frontend build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontend-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

      - name: Package
        run: |
          {
            echo "commit=${GITHUB_SHA}"
            echo "frontend_tree=$(git rev-parse HEAD:frontend)"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > frontend/dist/BUILD_INFO
          tar -C frontend -czf frontend-dist.tar.gz dist
          sha256sum frontend-dist.tar.gz > frontend-dist.tar.gz.sha256
          cat frontend/dist/BUILD_INFO

      - name: Publish release asset (frontend-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f frontend-latest "${GITHUB_SHA}"
          git push -f origin refs/tags/frontend-latest
          notes="Frontend build of ${GITHUB_SHA} (updated on every push to main). Installed on the VM by deploy/setup.sh and deploy/update.sh."
          if gh release view frontend-latest > /dev/null 2>&1; then
            gh release edit frontend-latest --notes "$notes"
          else
            gh release create frontend-latest --prerelease --title "Frontend build (latest main)" --notes "$notes"
          fi
          gh release upload frontend-latest frontend-dist.tar.gz frontend-dist.tar.gz.sha256 --clobber
