[project]
name = "momentum-terminal-backend"
version = "1.0.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::app.strategy.config.ConfigWarning", "ignore::DeprecationWarning:exchange_calendars.*", "ignore:Using .httpx. with .starlette.testclient."]
